name: .NET Framework 4.8 CI

on:
  push:
      branches: [ "master" ]
      tags:
      - 'v*' # Trigger workflow on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: windows-latest

    # Required permissions to create a release and upload assets
    permissions:
      contents: write

    steps:
    # 1. Check out the source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install and configure MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Install and configure NuGet CLI
    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: 'latest'

    # 4. Restore third-party packages
    - name: Restore NuGet Packages
      run: nuget restore Reposter.slnx

    # 5. Compile the C# solution using MSBuild
    - name: Build Solution
      run: msbuild Reposter.slnx /p:Configuration=Debug /p:Platform="Any CPU"

    # 6. Upload the built files so you can download them from GitHub
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Reposter
        path: ${{ github.workspace }}\Reposter\bin\Debug\
        if-no-files-found: error
        
    - name: Zip Output Files
      shell: powershell
      run: |
          # Compresses everything inside the Debug folder into a single zip file
          Compress-Archive -Path "Reposter\bin\Debug\*" -DestinationPath "Reposter-Release.zip" -Force

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: Reposter-Release.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
